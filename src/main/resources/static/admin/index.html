<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Artiv Studio</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script>
    /* 첫 페인트 전 테마 적용 — 플래시 방지 */
    (function () {
      try {
        var p = localStorage.getItem('artiv_theme') || 'system';
        var t = p === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : p;
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="/admin/styles.css" />
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toast" role="status" aria-live="assertive"></div>
  <script src="/admin/app.js"></script>
</body>
</html>
