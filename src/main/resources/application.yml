spring:
  application:
    name: AppToon
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway 가 소유. Hibernate 는 검증만.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB

server:
  port: 8080

app:
  storage:
    root: ${STORAGE_ROOT:storage}      # 업로드 이미지 저장 루트(로컬). 운영은 환경변수로 덮어씀.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}   # 프론트 origin 화이트리스트(콤마 구분). 개발=전체, 운영은 환경변수로 좁힘.

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 3600000        # 1시간 (ms)
  refresh-token-validity: 1209600000    # 14일 (ms)
