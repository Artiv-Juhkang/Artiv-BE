spring:
  application:
    name: Artiv
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway 가 소유. Hibernate 는 검증만.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB

server:
  port: 8080

app:
  storage:
    type: ${STORAGE_TYPE:local}        # local(로컬 디스크+/files) | s3(MinIO/R2/AWS S3)
    root: ${STORAGE_ROOT:storage}      # local 일 때 업로드 이미지 저장 루트. 운영은 환경변수로 덮어씀.
    s3:                                # type=s3 일 때만 사용
      endpoint: ${S3_ENDPOINT:}        # MinIO http://localhost:9000 / R2·AWS S3 엔드포인트
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:artiv}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      public-base-url: ${S3_PUBLIC_BASE_URL:}   # 이미지 공개 베이스(또는 CDN). 예: http://localhost:9000/artiv
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}   # 프론트 origin 화이트리스트(콤마 구분). 개발=전체, 운영은 환경변수로 좁힘.

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 3600000        # 1시간 (ms)
  refresh-token-validity: 1209600000    # 14일 (ms)
